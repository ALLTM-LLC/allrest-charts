apiVersion: batch/v1
kind: CronJob
metadata:
  name: fix-log-permissions
  namespace: app
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: fix-permissions
            image: busybox:latest
            command:
            - /bin/sh
            - -c
            - |
              chown -R 33:33 /var/www/project/storage/logs/ 2>/dev/null || true
              chmod -R 775 /var/www/project/storage/logs/ 2>/dev/null || true
              echo "Permissions fixed at $(date)"
          restartPolicy: OnFailure
